name: Daily Odyssey inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: daily-odyssey-inventory
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tracker and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check all Washington dealers
        id: scrape
        shell: bash
        run: |
          set +e
          odyssey-watch --fail-below-coverage 0.15
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save report and state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/index.html docs/inventory.csv docs/inventory.json docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update Odyssey inventory"
            git push
          fi

      - name: Mark severely incomplete runs as failed
        if: steps.scrape.outputs.exit_code != '0'
        run: |
          echo "Too few dealers could be checked. See the Dealer coverage section in docs/index.html."
          exit 1

